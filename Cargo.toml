[workspace]
resolver = "2"
members = [
    "foragers/reverb-arc-fs",
    "foragers/persona-base",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/reverbprotocol/protocol"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
getrandom = "0.2"
tempfile = "3"
